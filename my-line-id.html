<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็ค LINE ID ของฉัน — Monly Jelly</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#FF6B9D,#7B5EA7);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:#fff;border-radius:20px;padding:28px 24px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .emoji{font-size:44px;margin-bottom:8px}
  h1{font-size:18px;color:#2D2233;margin-bottom:6px}
  .sub{font-size:13px;color:#6a5a7a;margin-bottom:20px;line-height:1.6}
  .id-box{
    background:#F6F2FB;border:2px dashed #7B5EA7;border-radius:14px;padding:16px;
    margin-bottom:16px;word-break:break-all;font-family:monospace;font-size:14px;
    color:#2D2233;font-weight:700;min-height:24px;
  }
  .copy-btn{
    width:100%;padding:12px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#FF6B9D,#7B5EA7);color:#fff;font-weight:700;
    font-size:14px;cursor:pointer;margin-bottom:10px;
  }
  .name-box{font-size:13px;color:#6a5a7a;margin-bottom:16px}
  .status{font-size:12.5px;color:#6a5a7a;line-height:1.7}
  .warn{background:#FFF3CD;color:#856404;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>

<div class="card">
  <div class="emoji">🪪</div>
  <h1>เช็ค LINE ID ของฉัน</h1>
  <div class="sub">เปิดหน้านี้ผ่านแชทร้านค้าใน LINE เพื่อดู userId ของบัญชีตัวเอง<br>เอาไปตั้งค่า <b>ADMIN_LINE_USER_IDS</b> เพื่อรับแจ้งเตือนออเดอร์ใหม่ได้เลย</div>

  <div id="statusText" class="status">⏳ กำลังเช็ค...</div>
  <div id="resultArea" style="display:none">
    <div class="name-box" id="nameDisplay"></div>
    <div class="id-box" id="idDisplay">-</div>
    <button class="copy-btn" onclick="copyId()">📋 คัดลอก LINE ID</button>
  </div>

  <div class="warn" id="warnBox" style="display:none">
    ⚠️ หน้านี้ต้องเปิดผ่านแชทร้านค้าใน LINE เท่านั้นถึงจะเห็น ID ได้ (เปิดผ่านเบราว์เซอร์ทั่วไปจะไม่มี LINE ID ให้เช็ค)
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = "2010516208-6xWO1hHP";
  const statusText = document.getElementById('statusText');
  const resultArea = document.getElementById('resultArea');
  const warnBox = document.getElementById('warnBox');
  const idDisplay = document.getElementById('idDisplay');
  const nameDisplay = document.getElementById('nameDisplay');

  let currentUserId = '';

  function copyId() {
    navigator.clipboard.writeText(currentUserId).then(() => {
      const btn = document.querySelector('.copy-btn');
      const original = btn.textContent;
      btn.textContent = '✅ คัดลอกแล้ว!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }).catch(() => {
      alert('คัดลอกไม่สำเร็จ กรุณาแตะค้างที่ตัวอักษร ID เพื่อคัดลอกเองนะคะ');
    });
  }

  (async function init() {
    try {
      if (typeof liff === 'undefined') {
        statusText.textContent = '❌ โหลด LIFF ไม่สำเร็จ';
        warnBox.style.display = 'block';
        return;
      }
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        // หน้านี้ใช้เฉพาะแอดมิน ไม่มีเคส guest เลย ปลอดภัยที่จะบังคับ login ตรงนี้
        // (ต่างจากหน้าร้านหลักที่ต้องรองรับลูกค้าที่ไม่ได้ login LINE ด้วย) —
        // การ auto-detect ว่า login อยู่แล้วบางทีไม่ทำงานถ้าไม่ได้เปิดผ่าน endpoint
        // URL ที่ผูกกับ LIFF app นี้โดยตรง เลยต้องบังคับเรียก login() ให้ชัดเจนไปเลย
        statusText.textContent = '🔄 กำลังเชื่อมต่อ LINE...';
        liff.login({ redirectUri: window.location.href });
        return;
      }
      const profile = await liff.getProfile();
      currentUserId = profile.userId;
      statusText.style.display = 'none';
      nameDisplay.textContent = '👋 สวัสดีคุณ ' + profile.displayName;
      idDisplay.textContent = profile.userId;
      resultArea.style.display = 'block';
    } catch (e) {
      statusText.textContent = '❌ เกิดข้อผิดพลาด: ' + e.message;
      warnBox.style.display = 'block';
    }
  })();
</script>
</body>
</html>

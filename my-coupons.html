<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎟️ คูปองของฉัน - Monly Jelly</title>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--pink:#FF6B9D;--pink2:#FF9DC0;--purple:#7B5EA7;--purple2:#A07ED0;--dark:#2D2233;--gray:#6a5a7a;--gold:#D4A017;}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,body{min-height:100vh;font-family:'Mitr',sans-serif;color:var(--dark)}
    body {
      background: linear-gradient(160deg,
        #FF7FB4 0%, #FFA555 14%, #FFE45E 28%, #7EE081 42%,
        #4FD1E8 58%, #5FA8FF 72%, #B983FF 86%, #FF7FB4 100%
      );
      background-size: 300% 300%;
      animation: rainbowShift 10s ease infinite;
      padding: 20px;
    }
    @keyframes rainbowShift{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(45,34,51,0.25);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }
    .header h1 {
      font-family:'Nunito',sans-serif;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .content {
      padding: 20px;
    }

    /* ── แท่งพลังงานชีวิต (ระบบสะสมแต้ม) ── */
    .energy-box {
      background: #FBF9FF;
      border: 2px solid #F0EBFB;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 22px;
    }
    .energy-box-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .energy-box-title {
      font-family:'Nunito',sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: var(--dark);
    }
    .energy-box-count {
      font-family:'Nunito',sans-serif;
      font-weight: 800;
      font-size: 13px;
      color: var(--purple);
    }
    .energy-bar-track {
      width: 100%;
      height: 18px;
      background: #F0EBFB;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .energy-bar-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
      position: relative;
    }
    .energy-bar-fill.full {
      background: linear-gradient(90deg, var(--gold), #FFD65C);
    }
    .energy-box-sub {
      font-size: 11.5px;
      color: var(--gray);
      margin-top: 8px;
      line-height: 1.5;
    }

    .coupons-list {
      display: grid;
      gap: 20px;
    }
    .coupon-card {
      border-radius: 16px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(45,34,51,0.18);
    }
    .coupon-card.pastel-pink {
      background: linear-gradient(135deg, #FFB6D9 0%, #FFC6E4 100%);
    }
    .coupon-card.pastel-purple {
      background: linear-gradient(135deg, #D8A9FF 0%, #E5CCFF 100%);
    }
    .coupon-card.pastel-rainbow {
      background: linear-gradient(90deg, #FFB6D9, #FFD9B6, #FFEDD9, #D9FFD9, #D9F5FF, #D9D9FF);
    }
    .coupon-card.pastel-green {
      background: linear-gradient(135deg, #A8E6CF 0%, #C6F5D9 100%);
    }
    .coupon-card.loyalty-reward {
      background: linear-gradient(135deg, #FFE9A8 0%, #FFD65C 100%);
      color: var(--dark);
    }
    .coupon-card.game-reward {
      background: linear-gradient(135deg, #A8D8FF 0%, #C9B8FF 100%);
      color: var(--dark);
    }
    .coupon-info {
      flex: 1;
    }
    .coupon-info h3 {
      font-family:'Nunito',sans-serif;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .coupon-info p {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    .coupon-status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      background: rgba(255,255,255,0.3);
    }
    .coupon-status.used {
      background: rgba(0,0,0,0.15);
      text-decoration: line-through;
    }
    .coupon-action {
      text-align: right;
    }
    .coupon-value {
      font-family:'Nunito',sans-serif;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .btn-small {
      padding: 8px 12px;
      background: rgba(255,255,255,0.35);
      border: none;
      border-radius: 6px;
      color: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Mitr', sans-serif;
    }
    .btn-small:hover {
      background: rgba(255,255,255,0.55);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }
    .empty-state h2 {
      font-family:'Nunito',sans-serif;
      font-size: 19px;
      font-weight: 900;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .empty-state p {
      margin-bottom: 20px;
    }
    .btn-primary {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-family: 'Nunito', 'Mitr', sans-serif;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(123, 94, 167, 0.35);
    }
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .btn-secondary {
      display: inline-block;
      padding: 12px 24px;
      background: #F0EBFB;
      color: var(--purple);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-family: 'Mitr', sans-serif;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #E5DCF7;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray);
    }
  </style>
</head>
<body>
<style>
.mj-cust-nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#FFF7FA;border-bottom:2px solid #FFE3ED;position:sticky;top:0;z-index:999;-webkit-overflow-scrolling:touch}
.mj-cust-nav a{flex:0 0 auto;padding:8px 12px;background:#fff;border:2px solid #FFE3ED;border-radius:20px;text-decoration:none;color:#2D2233;font-weight:700;font-size:12.5px;white-space:nowrap;font-family:'Mitr',sans-serif}
.mj-cust-nav a.active{background:#FF6B9D;border-color:#FF6B9D;color:#fff}
</style>
<div class="mj-cust-nav">
  <a href="https://monly-jelly-application.vercel.app/index.html">🏠 หน้าแรก</a>
  <a href="customers-profile.html">👤 โปรไฟล์</a>
  <a href="coupon-customizer.html">🎂 ตั้งคูปองวันเกิด</a>
  <a href="my-coupons.html" class="active">🎟️ คูปองของฉัน</a>
</div>

  <div class="container">
    <div class="header">
      <h1>🎟️ คูปองของฉัน</h1>
      <p>คูปองวันเกิด 20 บาท (ไม่มีวันหมดอายุ)</p>
    </div>

    <div class="content">
      <div id="energyBoxWrap"></div>
      <div id="couponsContainer" class="loading">
        ⏳ กำลังโหลด...
      </div>

      <div class="buttons" id="actionButtons" style="display: none;">
        <a href="coupon-customizer.html" class="btn-primary">🎨 สร้างคูปองใหม่</a>
        <a href="customers-profile.html" class="btn-secondary">👤 แก้ไขโปรไฟล์</a>
        <a href="https://monly-jelly-application.vercel.app/index.html" class="btn-secondary">🏠 กลับหน้าแรก</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://monly-jelly-application.vercel.app';

    // ป้องกัน XSS: escape ข้อความที่ลูกค้าพิมพ์เอง (เช่น ข้อความคูปอง) ก่อนแสดงผล
    // เพราะ innerHTML รันโค้ด HTML/JavaScript ที่แอบใส่มาได้ ถ้าไม่ escape ก่อน
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }
    let userId = null;

    async function initLIFF() {
      // ── เช็ก ?userId= จาก URL ก่อนเสมอ (เช่น มาจากหน้าอื่นที่ส่งต่อมา) ──
      const urlParams = new URLSearchParams(window.location.search);
      const userIdFromUrl = urlParams.get('userId');
      if (userIdFromUrl) {
        userId = userIdFromUrl;
        localStorage.setItem('userId', userId);
        loadCoupons();
        return;
      }

      try {
        const liffId = "2010516208-6xWO1hHP";
        await window.liff.init({ liffId });
        if (window.liff.isLoggedIn()) {
          const profile = await window.liff.getProfile();
          userId = profile.userId;
          loadCoupons();
        } else {
          // ไม่บังคับ redirect ไป login LINE เด็ดขาด — หน้านี้ต้องเปิดได้จาก
          // เบราว์เซอร์ทั่วไปนอก LINE ด้วย (แค่จะไม่มีคูปองให้เห็นถ้าเป็น guest ใหม่)
          useGuestFallback();
        }
      } catch (err) {
        useGuestFallback();
      }
    }

    function useGuestFallback() {
      const savedGuestId = localStorage.getItem('userId');
      if (savedGuestId) {
        userId = savedGuestId;
        loadCoupons();
        return;
      }
      userId = 'guest-' + Date.now();
      localStorage.setItem('userId', userId);
      const noteBox = document.createElement('div');
      noteBox.style.cssText = 'background:#FFF3CD;color:#856404;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:12.5px;line-height:1.6;text-align:center';
      noteBox.textContent = '⚠️ ตอนนี้เปิดหน้านี้นอกแอป LINE อยู่ค่ะ — คูปองส่วนตัว (วันเกิด/สะสมแต้ม/เกม) ผูกกับบัญชี LINE ของคุณ กรุณาเปิดผ่านแชทร้านค้าใน LINE เพื่อดูคูปองของคุณนะคะ';
      const container = document.querySelector('.container') || document.body;
      container.insertBefore(noteBox, container.firstChild);
      loadCoupons();
    }

    async function loadCoupons() {
      try {
        const couponsRes = await fetch(`${API_BASE}/api/coupons?userId=${userId}`);
        if (!couponsRes.ok) throw new Error('Failed to load coupons');
        const data = await couponsRes.json();

        // ดึงข้อมูลโปรไฟล์แยกต่างหาก (ไว้เช็คว่าตั้งค่าธีมคูปองไว้ไหม) — ทำแบบ
        // "ไม่ผูกมัด" กับการโหลดคูปองหลัก ถ้าจุดนี้พังไม่ว่าเหตุผลอะไรก็ตาม
        // (network error, CORS ฯลฯ) จะไม่กระทบการแสดงคูปองจริงเลย แค่ไม่มี
        // ตัวอย่างคูปองโชว์เพิ่มเฉยๆ
        let profile = {};
        try {
          const profileRes = await fetch(`${API_BASE}/api/customer/${userId}`);
          if (profileRes.ok) profile = await profileRes.json();
        } catch (profileErr) {
          console.error('โหลดโปรไฟล์สำหรับตัวอย่างคูปองไม่สำเร็จ (ไม่กระทบคูปองจริง):', profileErr);
        }

        renderEnergyBar(profile);

        const hasUnusedCoupon = (data.coupons || []).some((c) => c.usedAt === null);
        // โชว์ "ตัวอย่างคูปอง" จากการตั้งค่าธีม/คำอวยพร ถ้ายังไม่มีคูปองจริงที่พร้อมใช้อยู่เลย
        // (คูปองจริงจะเกิดขึ้นเฉพาะวันเกิดจริงๆ ผ่านระบบอัตโนมัติทุกเที่ยงคืนเท่านั้น)
        const showPreview = profile.couponTheme && !hasUnusedCoupon;

        if (!data.coupons || data.coupons.length === 0) {
          showEmptyState(showPreview ? profile : null);
          return;
        }

        renderCoupons(data.coupons, showPreview ? profile : null);
      } catch (err) {
        console.error('Error:', err);
        showError('ไม่สามารถโหลดคูปองได้');
      }
    }

    // ต้องตรงกับ LOYALTY_POINTS_TARGET ใน lib/promotions.js เสมอ (ถ้าแก้ฝั่ง backend ต้องมาแก้ตรงนี้ด้วย)
    const LOYALTY_POINTS_TARGET = 5;

    function renderEnergyBar(profile) {
      const wrap = document.getElementById('energyBoxWrap');
      const points = profile.loyaltyPoints || 0;
      const pct = Math.min(100, Math.round((points / LOYALTY_POINTS_TARGET) * 100));
      const isFull = points >= LOYALTY_POINTS_TARGET;
      wrap.innerHTML = `
        <div class="energy-box">
          <div class="energy-box-top">
            <div class="energy-box-title">⚡ พลังงานชีวิต</div>
            <div class="energy-box-count">${points} / ${LOYALTY_POINTS_TARGET}</div>
          </div>
          <div class="energy-bar-track">
            <div class="energy-bar-fill${isFull ? ' full' : ''}" style="width:${pct}%"></div>
          </div>
          <div class="energy-box-sub">
            สั่งซื้อสำเร็จครบ ${LOYALTY_POINTS_TARGET} ครั้ง รับส่วนลด 15 บาททันที 🎉<br>
            ใช้ได้ภายใน 6 เดือนหลังได้รับ (ใช้ได้ 1 ครั้งต่อ 1 รางวัล ไม่สามารถรวมกับรางวัลอื่นได้)
          </div>
        </div>
      `;
    }

    function previewCardHtml(profile) {
      const greeting = profile.couponGreeting || `🎂 Happy Birthday, ${profile.name || ''}!`;
      const fontSizePx = { small: '12px', medium: '15px', large: '19px' }[profile.couponFontSize] || '13px';
      const textColorStyle = profile.couponTextColor ? `color:${escapeHtml(profile.couponTextColor)};` : '';
      return `
        <div class="coupon-card ${profile.couponTheme}" style="opacity:.75;position:relative">
          <div style="position:absolute;top:8px;right:8px;background:#fff;color:#7B5EA7;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px">🔍 ตัวอย่าง</div>
          <div class="coupon-info">
            <h3>🎂 คูปองวันเกิด</h3>
            <p style="font-size:${fontSizePx};${textColorStyle}">${escapeHtml(greeting)}</p>
            <div class="coupon-status">⏳ รอถึงวันเกิดของคุณ ระบบจะสร้างคูปองจริงให้อัตโนมัติ</div>
          </div>
          <div class="coupon-action">
            <div class="coupon-value">-20฿</div>
            <div style="font-size:11px">(ยังใช้ไม่ได้)</div>
          </div>
        </div>
      `;
    }

    function renderCoupons(coupons, previewProfile) {
      const container = document.getElementById('couponsContainer');
      container.className = 'coupons-list';

      container.innerHTML = (previewProfile ? previewCardHtml(previewProfile) : '') + coupons.map((coupon) => {
        const isUsed = coupon.usedAt !== null;
        const createdDate = new Date(coupon.createdAt).toLocaleDateString('th-TH');
        const displayCode = coupon.code || coupon.id; // รองรับคูปองเก่าที่อาจยังไม่มี code
        const fontSizePx = { small: '12px', medium: '15px', large: '19px' }[coupon.fontSize] || '13px';
        const textColorStyle = coupon.textColor ? `color:${escapeHtml(coupon.textColor)};` : '';

        // ── รางวัลจากระบบสะสมแต้ม "พลังงานชีวิต" — แยกหน้าตาจากคูปองวันเกิด ──
        if (coupon.source === 'loyalty') {
          const expiresDate = coupon.expiresAt ? new Date(coupon.expiresAt) : null;
          const daysLeft = expiresDate ? Math.ceil((expiresDate - new Date()) / (1000 * 60 * 60 * 24)) : null;
          const isExpired = daysLeft !== null && daysLeft < 0 && !isUsed;
          let statusText;
          if (isUsed) statusText = `✅ ใช้ไปแล้ว (Order #${coupon.usedInOrderId})`;
          else if (isExpired) statusText = '⌛ หมดอายุแล้ว';
          else statusText = `✨ พร้อมใช้ — เหลืออีก ${daysLeft} วัน`;

          return `
            <div class="coupon-card loyalty-reward${isExpired ? '' : ''}" style="${isExpired ? 'opacity:.6' : ''}">
              <div class="coupon-info">
                <h3>⚡ รางวัลสะสมแต้ม</h3>
                <p>สะสมแต้มครบ ${LOYALTY_POINTS_TARGET} ครั้ง รับส่วนลดนี้ทันที!</p>
                <div class="coupon-status ${isUsed || isExpired ? 'used' : ''}">${statusText}</div>
                <p style="margin-top: 8px; font-size: 11px;">ได้รับเมื่อ ${createdDate}${expiresDate ? ' · หมดอายุ ' + expiresDate.toLocaleDateString('th-TH') : ''}</p>
              </div>
              <div class="coupon-action">
                <div class="coupon-value">-${coupon.discount}฿</div>
                <div style="font-size: 15px; font-weight: 900; letter-spacing: 1px;">${escapeHtml(displayCode)}</div>
                ${!isUsed && !isExpired ? `<button class="btn-small" onclick="copyCoupon('${escapeHtml(displayCode)}')">📋 คัดลอกโค้ด</button>` : ''}
              </div>
            </div>
          `;
        }

        // ── โค้ดจากการเล่นเกม (เช่น Monly Lucky Game คำทำนายวันนี้) — แยกเอกเทศจากแต้มสะสมและคูปองวันเกิด ──
        if (coupon.source === 'game') {
          const expiresDate = coupon.expiresAt ? new Date(coupon.expiresAt) : null;
          const daysLeft = expiresDate ? Math.ceil((expiresDate - new Date()) / (1000 * 60 * 60 * 24)) : null;
          const isExpired = daysLeft !== null && daysLeft < 0 && !isUsed;
          let statusText;
          if (isUsed) statusText = `✅ ใช้ไปแล้ว (Order #${coupon.usedInOrderId})`;
          else if (isExpired) statusText = '⌛ หมดอายุแล้ว';
          else statusText = `✨ พร้อมใช้ — เหลืออีก ${daysLeft} วัน`;

          return `
            <div class="coupon-card game-reward" style="${isExpired ? 'opacity:.6' : ''}">
              <div class="coupon-info">
                <h3>🔮 โค้ดจากคำทำนายวันนี้</h3>
                <p>ได้รับจากการเล่น Monly Lucky Game 🔮</p>
                <div class="coupon-status ${isUsed || isExpired ? 'used' : ''}">${statusText}</div>
                <p style="margin-top: 8px; font-size: 11px;">ได้รับเมื่อ ${createdDate}${expiresDate ? ' · หมดอายุ ' + expiresDate.toLocaleDateString('th-TH') : ''}</p>
              </div>
              <div class="coupon-action">
                <div class="coupon-value">-${coupon.discountPercent}%</div>
                <div style="font-size: 15px; font-weight: 900; letter-spacing: 1px;">${escapeHtml(displayCode)}</div>
                ${!isUsed && !isExpired ? `<button class="btn-small" onclick="copyCoupon('${escapeHtml(displayCode)}')">📋 คัดลอกโค้ด</button>` : ''}
              </div>
            </div>
          `;
        }

        return `
          <div class="coupon-card ${coupon.theme}">
            <div class="coupon-info">
              <h3>🎂 คูปองวันเกิด</h3>
              <p style="font-size:${fontSizePx};${textColorStyle}">${escapeHtml(coupon.greeting || 'Happy Birthday!')}</p>
              <div class="coupon-status ${isUsed ? 'used' : ''}">
                ${isUsed ? `✅ ใช้ไปแล้ว (Order #${coupon.usedInOrderId})` : '✨ พร้อมใช้ — นำโค้ดไปกรอกตอนสั่งซื้อได้เลย'}
              </div>
              <p style="margin-top: 8px; font-size: 11px;">สร้างเมื่อ ${createdDate}</p>
            </div>
            <div class="coupon-action">
              <div class="coupon-value">-20฿</div>
              <div style="font-size: 15px; font-weight: 900; letter-spacing: 1px;">${escapeHtml(displayCode)}</div>
              ${!isUsed ? `<button class="btn-small" onclick="copyCoupon('${escapeHtml(displayCode)}')">📋 คัดลอกโค้ด</button>` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('actionButtons').style.display = 'flex';
    }

    function showEmptyState(previewProfile) {
      const container = document.getElementById('couponsContainer');
      container.className = '';

      if (previewProfile) {
        // ตั้งค่าธีม/คำอวยพรไว้แล้ว แต่ยังไม่ถึงวันเกิด → โชว์ตัวอย่างคูปองแทนหน้าว่างเปล่า
        container.className = 'coupons-list';
        container.innerHTML = previewCardHtml(previewProfile) + `
          <div class="empty-state" style="margin-top:12px">
            <p>ตั้งค่าคูปองไว้เรียบร้อยแล้ว! รอถึงวันเกิดของคุณ ระบบจะสร้างคูปองจริงให้อัตโนมัติ</p>
            <a href="coupon-customizer.html" class="btn-primary">🎨 แก้ไขการตั้งค่า</a>
          </div>
        `;
        document.getElementById('actionButtons').style.display = 'flex';
        return;
      }

      container.innerHTML = `
        <div class="empty-state">
          <h2>🎁 ยังไม่มีคูปองจากวันเกิด</h2>
          <p>สร้างคูปองวันเกิดของคุณเลย!</p>
          <a href="coupon-customizer.html" class="btn-primary">🎨 สร้างคูปองใหม่</a>
        </div>
      `;
      document.getElementById('actionButtons').style.display = 'flex';
    }

    function showError(message) {
      const container = document.getElementById('couponsContainer');
      container.className = '';
      container.innerHTML = `<div style="text-align: center; color: #c62828; padding: 40px;">❌ ${message}</div>`;
      // ยังโชว์ปุ่มกลับหน้าแรกไว้เสมอ กันลูกค้าติดค้างไม่มีทางออกตอนโหลดพลาด
      document.getElementById('actionButtons').style.display = 'flex';
    }

    function copyCoupon(code) {
      navigator.clipboard.writeText(code).then(() => {
        alert('✅ คัดลอกโค้ดส่วนลดแล้ว: ' + code + '\n\nนำไปกรอกในช่อง "โค้ดส่วนลด" ตอนสั่งซื้อได้เลยค่ะ');
      });
    }

    initLIFF();
  </script>
  <script src="https://d.line-scdn.net/liff/edge/2.1/sdk.js"></script>
</body>
</html>

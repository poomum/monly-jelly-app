<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👤 โปรไฟล์ของฉัน - Monly Jelly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 13px;
      opacity: 0.9;
    }
    .content {
      padding: 30px 20px;
    }
    .avatar-section {
      text-align: center;
      margin-bottom: 30px;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f0f0f0;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      border: 4px solid #667eea;
      overflow: hidden;
      object-fit: cover;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-label {
      font-size: 13px;
      color: #999;
    }
    .upload-btn {
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      transition: border 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .form-group small {
      display: block;
      color: #999;
      margin-top: 6px;
      font-size: 12px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-save {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    .btn-cancel {
      background: #f0f0f0;
      color: #333;
    }
    .btn-cancel:hover {
      background: #e0e0e0;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
      font-weight: 600;
      display: none;
    }
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }
    .info-box {
      background: #f5f7ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }
    .file-input-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👤 โปรไฟล์ของฉัน</h1>
      <p>แก้ไขข้อมูลส่วนตัวและวันเกิด</p>
    </div>

    <div class="content">
      <div class="info-box">
        💡 ข้อมูลนี้ใช้สำหรับทำคูปองวันเกิดอัตโนมัติและจัดส่ง
      </div>

      <form id="profileForm">
        <div class="avatar-section">
          <div class="avatar" id="avatarDisplay">📸</div>
          <p class="avatar-label">รูปโปรไฟล์</p>
          <input type="file" id="avatarInput" class="file-input-hidden" accept="image/*">
          <button type="button" class="btn btn-cancel" onclick="document.getElementById('avatarInput').click()" style="margin-top: 10px; width: auto;">
            📤 เลือกรูป
          </button>
        </div>

        <div class="form-group">
          <label for="userName">ชื่อของคุณ *</label>
          <input type="text" id="userName" placeholder="เช่น อลิส" required>
          <small>ชื่อนี้จะแสดงบนคูปองวันเกิด</small>
        </div>

        <div class="form-group">
          <label for="userBirthday">วันเกิด *</label>
          <input type="date" id="userBirthday" required>
          <small>ระบบจะส่งคูปอง 20 บาทในวันเกิดของคุณ</small>
        </div>

        <div class="form-group">
          <label for="userPhone">เบอร์โทรศัพท์</label>
          <input type="tel" id="userPhone" placeholder="08X-XXX-XXXX">
          <small>สำหรับการติดต่อสอบถาม</small>
        </div>

        <div class="button-group">
          <button type="reset" class="btn btn-cancel">🔄 ยกเลิก</button>
          <button type="submit" class="btn btn-save">💾 บันทึกโปรไฟล์</button>
        </div>

        <div class="status" id="status"></div>
      </form>

      <div id="historyPanel" style="margin-top:20px;display:none">
        <h2 style="font-size:16px;margin-bottom:10px">🧾 ประวัติการสั่งซื้อของคุณ</h2>
        <div id="historySummary" style="background:#F5F3FF;border-radius:12px;padding:16px;font-size:13.5px;line-height:1.8"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://monly-jelly-application.vercel.app';
    let userId = null;
    let avatarBase64 = null;

    // รับ userId จาก LINE LIFF
    async function initLIFF() {
      try {
        const liffId = "2010516208-6xWO1hHP";
        window.liff.init({ liffId })
          .then(() => {
            if (!window.liff.isLoggedIn()) {
              window.liff.login();
            } else {
              const profile = window.liff.getProfile();
              userId = profile.userId;
              loadProfile();
            }
          });
      } catch (err) {
        console.error("LIFF init error:", err);
        // Fallback: ใช้ localStorage user
        userId = localStorage.getItem('userId') || 'user-' + Date.now();
        loadProfile();
      }
    }

    // โหลดโปรไฟล์
    async function loadProfile() {
      try {
        const res = await fetch(`${API_BASE}/api/customer/${userId}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.name !== undefined) {
            document.getElementById('userName').value = data.name || '';
            document.getElementById('userBirthday').value = data.birthday || '';
            document.getElementById('userPhone').value = data.phone || '';
            if (data.avatar) {
              document.getElementById('avatarDisplay').innerHTML = `<img src="${data.avatar}">`;
              avatarBase64 = data.avatar;
            }
          }
        }
      } catch (err) {
        console.error('Error loading profile:', err);
      }
      loadPurchaseHistory();
    }

    async function loadPurchaseHistory() {
      try {
        const res = await fetch(`${API_BASE}/api/customer-history?userId=${userId}`);
        if (!res.ok) return;
        const h = await res.json();

        if (!h.paidOrderCount || h.paidOrderCount === 0) return; // ยังไม่เคยซื้อ ไม่ต้องโชว์อะไร

        const panel = document.getElementById('historyPanel');
        const summary = document.getElementById('historySummary');
        panel.style.display = 'block';

        const flavorLines = h.flavorBreakdown.map((f) =>
          `${f.name}: ${f.totalQty} ชิ้น (${f.orderCount} ครั้ง)`
        ).join('<br>');

        summary.innerHTML = `
          🛍️ สั่งซื้อสำเร็จแล้ว <b>${h.paidOrderCount}</b> ครั้ง รวม <b>฿${h.totalSpent.toLocaleString()}</b><br>
          ${h.favoriteFlavor ? `⭐ รสที่ชอบที่สุด: <b>${h.favoriteFlavor.name}</b><br>` : ''}
          <br>
          <b>แยกตามรสชาติ:</b><br>
          ${flavorLines}
        `;
      } catch (err) {
        console.error('Error loading purchase history:', err);
      }
    }

    // เลือกรูป
    document.getElementById('avatarInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        avatarBase64 = event.target.result;
        document.getElementById('avatarDisplay').innerHTML = `<img src="${avatarBase64}">`;
      };
      reader.readAsDataURL(file);
    });

    // บันทึกโปรไฟล์
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');

      try {
        const payload = {
          name: document.getElementById('userName').value.trim(),
          birthday: document.getElementById('userBirthday').value,
          phone: document.getElementById('userPhone').value.trim(),
          avatar: avatarBase64 || '',
        };

        const res = await fetch(`${API_BASE}/api/customer/${userId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) throw new Error('Failed to save profile');

        status.className = 'status success';
        status.textContent = '✅ บันทึกโปรไฟล์สำเร็จ!';
        
        setTimeout(() => {
          status.style.display = 'none';
        }, 3000);

      } catch (err) {
        status.className = 'status error';
        status.textContent = '❌ เกิดข้อผิดพลาด: ' + err.message;
      }
    });

    // เริ่มต้น
    initLIFF();
  </script>
  <script src="https://d.line-scdn.net/liff/edge/2.1/sdk.js"></script>
</body>
</html>
